---
name: cron-tasks

on:
  schedule:
    - cron: "30 3 * * 0"

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14.x"
  UV_VERSION: "0.12.x"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  pre-badge-coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      COV_PER: ${{ steps.get-coverage-results.outputs.COV_PER }}
      COV_RUN: ${{ steps.get-coverage-results.outputs.COV_RUN }}

    steps:
      - name: Checkout source code # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python # https://github.com/marketplace/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup UV # https://github.com/marketplace/actions/astral-sh-setup-uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "true"

      - name: Install test dependency-group
        shell: bash
        run: make test-only

      - name: Run coverage
        id: run-coverage
        shell: bash
        run: make test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Get coverage results
        id: get-coverage-results
        shell: bash
        run: |
          echo "COV_RUN=${{ steps.run-coverage.outcome }}" >> "$GITHUB_OUTPUT"
          echo "COV_PER=$(uv run coverage report | grep TOTAL | awk '{print $6}')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage # https://github.com/marketplace/actions/upload-artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: htmlcov/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 6

  badge-coverage:
    runs-on: ubuntu-latest
    needs: pre-badge-coverage

    permissions:
      contents: write

    steps:
      - name: Run setup-badge # https://github.com/marketplace/actions/setup-badge
        id: badge-coverage
        uses: tagdots/setup-badge@9f61d39dc1c258a684d6f6ddac04d79a51d15144 # 1.2.3
        with:
          badge-name: coverage
          badge-url: https://github.com/${{ github.repository }}/actions/workflows/cron-tasks.yaml
          label: "Code Coverage"
          message: "${{ needs.pre-badge-coverage.outputs.COV_PER }}"

  stale-workflow-runs:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Run delete-workflow-runs # https://github.com/marketplace/actions/delete-github-workflow-runs
        id: delete-workflow-runs
        uses: tagdots/delete-workflow-runs@a63410508ae00a97f25514ac373ac99f2a19d6fb # 1.2.35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo-url: ${{ github.server_url }}/${{ github.repository }}
          max-days: 10
          dry-run: false

      - name: Get data and set GITHUB_OUTPUT
        id: get_data
        shell: bash
        run: |
          cat data_dict.log | jq .

  stale-issues-prs:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run stale # https://github.com/actions/stale
        id: stale-issues-prs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: "This issue is stale because it has been open 5 days with no activity. Remove stale label or comment or this will be closed in 3 days after stale"
          days-before-stale: 5
          days-before-close: 3
          delete-branch: true

  stale-branches:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Run delete-branches # https://github.com/marketplace/actions/delete-github-branches
        id: delete-branches
        uses: tagdots/delete-branches@5b1552f97bafc0fefdb6d5029d568bb272d32f82 # 1.2.17
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo-url: ${{ github.server_url }}/${{ github.repository }}
          max-idle-days: 10
          exclude-branches: "badges,dev"
          dry-run: false

  update-pre-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate a token from Github App # https://github.com/marketplace/actions/create-github-app-token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SECRET_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECRET_GITHUB_APP_PEM_FILE }}

      - name: Run update-pre-commit # https://github.com/marketplace/actions/update-pre-commit
        id: update-pre-commit
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        uses: tagdots/update-pre-commit@ee7da5cea23f7a067f3b995653e3c7e60270f21f # 1.3.0
        with:
          file: .pre-commit-config.yaml
          dry-run: false
          open-pr: true

  notify-slack:
    if: always()
    needs:
      [
        badge-coverage,
        stale-workflow-runs,
        stale-issues-prs,
        stale-branches,
        update-pre-commit,
      ]
    runs-on: ubuntu-latest

    outputs:
      WORKFLOW_RESULT: ${{ steps.get-overall-jobs-results.outputs.WORKFLOW_RESULT }}

    steps:
      - name: Get overall jobs results
        id: get-overall-jobs-results
        shell: bash
        run: |
          if ${{
            needs.badge-coverage.result == 'success'
            && needs.stale-workflow-runs.result == 'success'
            && needs.stale-issues-prs.result == 'success'
            && needs.stale-branches.result == 'success'
            && needs.update-pre-commit.result == 'success' }}; then
            echo "WORKFLOW_RESULT=:white_check_mark:" >> "$GITHUB_OUTPUT"
          else
            echo "WORKFLOW_RESULT=:no_entry:" >> "$GITHUB_OUTPUT"
          fi

      - name: Post message to Slack # https://github.com/marketplace/actions/the-slack-github-action
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: "${{ secrets.SECRET_SLACK_APP_GITHUB_BOT }}"
          payload: |
            channel: "${{ secrets.SECRET_SLACK_CHANNEL_CRON_TASKS }}"
            text: "
              *Repository: ${{ github.repository }}*\n
              *Workflow : ${{ github.workflow }} ${{ steps.get-overall-jobs-results.outputs.WORKFLOW_RESULT }}*
              ```
              URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n
              Job: badge-coverage      - ${{ needs.badge-coverage.result }}\n
              Job: stale-workflow-runs - ${{ needs.stale-workflow-runs.result }}\n
              Job: stale-issues-prs    - ${{ needs.stale-issues-prs.result }}\n
              Job: stale-branches      - ${{ needs.stale-branches.result }}\n
              Job: update-pre-commit   - ${{ needs.update-pre-commit.result }}
              ```"
