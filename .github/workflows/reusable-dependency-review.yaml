---
name: re-dependency-review

on: # yamllint disable-line rule:truthy
  workflow_call: {}

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull Request dependency review # https://github.com/marketplace/actions/dependency-review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # 5.0.1
        with:
          license-check: false
          vulnerability-check: true
          show-openssf-scorecard: false
          fail-on-severity: low
