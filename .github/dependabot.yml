version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "15 0 * * 0"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "[GITHUB-ACTIONS] "
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    cooldown:
      default-days: 3
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "cron"
      cronjob: "15 0 * * 0"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    versioning-strategy: increase
    groups:
      uv:
        patterns:
          - "*"
    commit-message:
      prefix: "[UV] "
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    cooldown:
      default-days: 3
      semver-major-days: 15
      semver-minor-days: 7
